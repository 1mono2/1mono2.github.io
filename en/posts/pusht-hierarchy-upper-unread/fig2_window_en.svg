<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 290" width="500" height="290" role="img" aria-label="One training window: the lower predicts block 0, the upper reads its endpoint and emits c₁, and the lower of block 1 reads c₁" font-family="'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', system-ui, sans-serif" font-size="12" fill="#1d1f24"><rect width="500" height="290" fill="#ffffff"/><defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1d1f24"/></marker>
<marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2a78d6"/></marker>
<marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#eb6834"/></marker>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b2342f"/></marker>
<marker id="arm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5d6270"/></marker>
</defs><g transform="translate(20,10)"><text x="10" y="18" font-size="12.5" text-anchor="start" font-weight="700" fill="#1d1f24" >One training window of the hierarchy (2 blocks = 64 steps)</text><rect x="20" y="160" width="170" height="52" rx="6" fill="#dbe9f3" stroke="#2a78d6" stroke-width="1.5" /><text x="105" y="181" font-size="11" text-anchor="middle" font-weight="400" fill="#1d1f24" >Block 0 (lower, 4 chunks)</text><text x="105" y="200" font-size="10.5" text-anchor="middle" font-weight="400" fill="#5d6270" >reads c₀</text><rect x="270" y="160" width="170" height="52" rx="6" fill="#dbe9f3" stroke="#2a78d6" stroke-width="1.5" /><text x="355" y="181" font-size="11" text-anchor="middle" font-weight="400" fill="#1d1f24" >Block 1 (lower, 4 chunks)</text><text x="355" y="200" font-size="10.5" text-anchor="middle" font-weight="400" fill="#5d6270" >reads c₁</text><circle cx="60" cy="40" r="16" fill="#ffffff" stroke="#6b7280" stroke-width="2"/><text x="60" y="45" font-size="12" text-anchor="middle" font-weight="700" fill="#1d1f24" >c₀</text><circle cx="400" cy="40" r="16" fill="#f6e4d4" stroke="#eb6834" stroke-width="2"/><text x="400" y="45" font-size="12" text-anchor="middle" font-weight="700" fill="#1d1f24" >c₁</text><text x="60" y="80" font-size="10.5" text-anchor="middle" font-weight="400" fill="#5d6270" >learned constant</text><rect x="200" y="22" width="130" height="36" rx="5" fill="#eb6834" stroke="#eb6834" stroke-width="1" /><text x="265" y="45" font-size="11" text-anchor="middle" font-weight="700" fill="#fff" >Upper u_ψ</text><rect x="120" y="100" width="80" height="26" rx="4" fill="#ffffff" stroke="#2a78d6" stroke-width="1.5" /><text x="160" y="118" font-size="11" text-anchor="middle" font-weight="400" fill="#1d1f24" >endpoint E₀</text><text x="205" y="142" font-size="10.5" text-anchor="middle" font-weight="400" fill="#5d6270" >the lower's 6-step Euler prediction</text><line x1="60" y1="56" x2="60" y2="158" stroke="#1d1f24" stroke-width="1.6" marker-end="url(#ar)"/><line x1="105" y1="158" x2="140" y2="128" stroke="#1d1f24" stroke-width="1.6" marker-end="url(#ar)"/><line x1="200" y1="108" x2="235" y2="60" stroke="#1d1f24" stroke-width="1.6" marker-end="url(#ar)"/><line x1="76" y1="40" x2="198" y2="40" stroke="#1d1f24" stroke-width="1.6" marker-end="url(#ar)"/><text x="137" y="34" font-size="10.5" text-anchor="middle" font-weight="400" fill="#5d6270" >c₀ is also an input</text><line x1="330" y1="40" x2="382" y2="40" stroke="#1d1f24" stroke-width="1.6" marker-end="url(#ar)"/><line x1="400" y1="56" x2="400" y2="158" stroke="#1d1f24" stroke-width="1.6" marker-end="url(#ar)"/><text x="355" y="236" font-size="10.5" text-anchor="middle" font-weight="400" fill="#b2342f" >loss L₁ (block 1 prediction error)</text><text x="105" y="236" font-size="10.5" text-anchor="middle" font-weight="400" fill="#b2342f" >loss L₀</text><line x1="412" y1="158" x2="412" y2="60" stroke="#b2342f" stroke-width="1.4" marker-end="url(#arr)" stroke-dasharray="5 3"/><line x1="382" y1="30" x2="330" y2="30" stroke="#b2342f" stroke-width="1.4" marker-end="url(#arr)" stroke-dasharray="5 3"/><line x1="245" y1="66" x2="210" y2="114" stroke="#b2342f" stroke-width="1.4" marker-end="url(#arr)" stroke-dasharray="5 3"/><line x1="152" y1="132" x2="118" y2="160" stroke="#b2342f" stroke-width="1.4" marker-end="url(#arr)" stroke-dasharray="5 3"/><text x="230" y="256" font-size="10.5" text-anchor="middle" font-weight="400" fill="#b2342f" >gradient: L₁ → c₁ → upper → E₀ → block 0 lower (red dashed)</text></g></svg>
