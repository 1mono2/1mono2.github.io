idth="1.1" marker-end="url(#arb)" stroke-dasharray="3 3"/><path d="M327.5 234 C 327.5 206, 370.0 200, 370.0 172" fill="none" stroke="#2a78d6" stroke-width="1.1" marker-end="url(#arb)" stroke-dasharray="3 3"/><path d="M398.5 234 C 398.5 206, 403.0 200, 403.0 172" fill="none" stroke="#2a78d6" stroke-width="1.1" marker-end="url(#arb)" stroke-dasharray="3 3"/><text x="292.0" y="210" font-size="9.5" text-anchor="middle" font-weight="400" fill="#2a78d6" >reads the predicted endpoints of block 0's 4 chunks (136 tokens)</text><line x1="424.0" y1="150" x2="434.0" y2="150" stroke="#eb6834" stroke-width="1.5" marker-end="url(#aro)"/><circle cx="448.0" cy="150" r="13" fill="#f6e4d4" stroke="#eb6834" stroke-width="2"/><text x="448.0" y="154" font-size="12" text-anchor="middle" font-weight="700" fill="#1d1f24" >c₁</text><text x="488.0" y="128" font-size="9.5" text-anchor="start" font-weight="400" fill="#eb6834" >1 token (1280-d)</text><line x1="462.0" y1="150" x2="682.5" y2="150" stroke="#eb6834" stroke-width="1.5"/><line x1="469.5" y1="150" x2="469.5" y2="234" stroke="#eb6834" stroke-width="1.3" marker-end="url(#aro)"/><line x1="540.5" y1="150" x2="540.5" y2="234" stroke="#eb6834" stroke-width="1.3" marker-end="url(#aro)"/><line x1="611.5" y1="150" x2="611.5" y2="234" stroke="#eb6834" stroke-width="1.3" marker-end="url(#aro)"/><line x1="682.5" y1="150" x2="682.5" y2="234" stroke="#eb6834" stroke-width="1.3" marker-end="url(#aro)"/><text x="576.0" y="210" font-size="9.5" text-anchor="middle" font-weight="400" fill="#eb6834" >block 1's 4 chunks read c₁ by cross-attention</text><rect x="658.0" y="130" width="120" height="40" rx="5" fill="#ffffff" stroke="#eb6834" stroke-width="1.2" stroke-dasharray="4 3"/><text x="718.0" y="154" font-size="10" text-anchor="middle" font-weight="400" fill="#eb6834" >next upper → c₂</text><path d="M702.5 234 C 712.5 206, 678.0 190, 678.0 172" fill="none" stroke="#2a78d6" stroke-width="1" marker-end="url(#arb)" stroke-dasharray="3 3"/><path d="M758.0 170 L773.5 234" fill="none" stroke="#eb6834" stroke-width="1.1" marker-end="url(#aro)" stroke-dasharray="3 3"/><rect x="16" y="338" width="868" height="80" rx="6" fill="#eceae3" stroke="#c9c6bd" stroke-width="1" /><text x="30" y="360" font-size="12" text-anchor="start" font-weight="700" fill="#2a78d6" >flat (the baseline)</text><text x="30" y="380" font-size="11" text-anchor="start" font-weight="400" fill="#1d1f24" >No upper; every block reads c₀. Lower architecture, init, data and random streams match hier; the only difference is the upper.</text><text x="30" y="398" font-size="10.5" text-anchor="start" font-weight="400" fill="#5d6270" >Evaluation: run from the initial states of the 439 test episodes; success if the T reaches (256, 256, 45°) within 20 px / 20° in 300 steps.</text><text x="30" y="412" font-size="10.5" text-anchor="start" font-weight="400" fill="#5d6270" >The policy receives no goal. 63.3% of the demonstrations end inside this criterion (the imitation ceiling).</text></svg>
