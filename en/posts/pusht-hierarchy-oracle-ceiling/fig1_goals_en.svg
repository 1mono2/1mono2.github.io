cy's lag)</text><path d="M460.0 445 L603.0 445" fill="none" stroke="#1baf7a" stroke-width="1.3" marker-end="url(#arm)" stroke-dasharray="3 2"/><text x="531.5" y="441" font-size="9.5" text-anchor="middle" font-weight="700" fill="#1baf7a" >+32 rows</text><text x="16" y="484" font-size="12" text-anchor="start" font-weight="700" fill="#1d1f24" >null (empty goal)</text><text x="16" y="502" font-size="10.5" text-anchor="start" font-weight="400" fill="#5d6270" >same weights run with an empty goal (presence embedding 0). Control for whether goal training hurt the lower</text><rect x="200" y="530" width="650" height="26" rx="3" fill="#ffffff" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="4 3"/><text x="525.0" y="547" font-size="10.5" text-anchor="middle" font-weight="400" fill="#5d6270" >no goal (presence embedding 0); the same weights run as flat</text><text x="16" y="598" font-size="10" text-anchor="start" font-weight="400" fill="#5d6270" >The goal is re-picked every 32 steps; the 4 chunks of a block read the same goal (age 0/8/16/24 tells the steps remaining). After the demo ends it is pinned to the last row.</text></svg>
