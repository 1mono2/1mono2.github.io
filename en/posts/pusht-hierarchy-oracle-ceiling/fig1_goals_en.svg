<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 610" width="900" height="610" role="img" aria-label="Four ways to give the goal: clock- and progress-aligned use the same demo 32 steps ahead, swap another episode, null an empty goal" font-family="'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', system-ui, sans-serif" font-size="12" fill="#1d1f24"><rect width="900" height="610" fill="#ffffff"/><defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1d1f24"/></marker>
<marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2a78d6"/></marker>
<marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#eb6834"/></marker>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b2342f"/></marker>
<marker id="arm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5d6270"/></marker>
</defs><text x="16" y="24" font-size="14" text-anchor="start" font-weight="700" fill="#1d1f24" >Giving the lower the true latent 32 steps ahead as its goal</text><rect x="16" y="40" width="868" height="74" rx="6" fill="#eceae3" stroke="#c9c6bd" stroke-width="1" /><text x="30" y="62" font-size="12" text-anchor="start" font-weight="700" fill="#1d1f24" >Training</text><text x="30" y="82" font-size="11" text-anchor="start" font-weight="400" fill="#1d1f24" >No upper. Each block's goal g = the I-JEPA latent (4 tokens) 32 steps later in the same demonstration, fed to the lower's cross-attention in place of c₀.</text><text x="30" y="100" font-size="11" text-anchor="start" font-weight="400" fill="#1d1f24" >In 10% of (window, block) pairs the goal is empty (so the null condition lies inside the training distribution). Everything else matches flat.</text><text x="16" y="148" font-size="12" text-anchor="start" font-weight="700" fill="#2a78d6" >oracle_time (clock-aligned)</text><text x="16" y="166" font-size="10.5" text-anchor="start" font-weight="400" fill="#5d6270" >goal = demonstration row “start + steps executed + 32”. Advances by the clock even if the policy lags (co-primary)</text><rect x="200" y="194" width="650" height="26" rx="3" fill="#dbe9f3" stroke="#2a78d6" stroke-width="1.2" /><line x1="232.5" y1="194" x2="232.5" y2="220" stroke="#2a78d6" stroke-width="0.5"/><line x1="265.0" y1="194" x2="265.0" y2="220" stroke="#2a78d6" stroke-width="0.5"/><line x1="297.5" y1="194" x2="297.5" y2="220" stroke="#2a78d6" stroke-width="0.5"/><line x1="330.0" y1="194" x2="330.0" y2="220" stroke="#2a78d6" stroke-width="0.5"/><line x1="362.5" y1="194" x2="362.5" y2="220" stroke="#2a78d6" stroke-width="0.5"/><line x1="395.0" y1="194" x2="395.0" y2="220" stroke="#2a78d6" stroke-width="0.5"/><line x1="427.5" y1="194" x2="427.5" y2="220" stroke="#2a78d6" stroke-width="0.5"/><line x1="460.0" y1="194" x2="460.0" y2="220" stroke="#2a78d6" stroke-width="0.5"/><line x1="492.5" y1="194" x2="492.5" y2="220" stroke="#2a78d6" stroke-width="0.5"/><line x1="525.0" y1="194" x2="525.0" y2="220" stroke="#2a78d6" stroke-width="0.5"/><line x1="557.5" y1="194" x2="557.5" y2="220" stroke="#2a78d6" stroke-width="0.5"/><line x1="590.0" y1="194" x2="590.0" y2="220" stroke="#2a78d6" stroke-width="0.5"/><line x1="622.5" y1="194" x2="622.5" y2="220" stroke="#2a78d6" stroke-width="0.5"/><line x1="655.0" y1="194" x2="655.0" y2="220" stroke="#2a78d6" stroke-width="0.5"/><line x1="687.5" y1="194" x2="687.5" y2="220" stroke="#2a78d6" stroke-width="0.5"/><line x1="720.0" y1="194" x2="720.0" y2="220" stroke="#2a78d6" stroke-width="0.5"/><line x1="752.5" y1="194" x2="752.5" y2="220" stroke="#2a78d6" stroke-width="0.5"/><line x1="785.0" y1="194" x2="785.0" y2="220" stroke="#2a78d6" stroke-width="0.5"/><line x1="817.5" y1="194" x2="817.5" y2="220" stroke="#2a78d6" stroke-width="0.5"/><text x="192" y="206" font-size="10" text-anchor="end" font-weight="400" fill="#2a78d6" >same episode's demo</text><text x="192" y="218" font-size="9" text-anchor="end" font-weight="400" fill="#5d6270" >row 0 … last row</text><path d="M597.0 184 L609.0 184 L603.0 192 z" fill="#2a78d6" stroke="#2a78d6" stroke-width="1"/><text x="603.0" y="179" font-size="10" text-anchor="middle" font-weight="700" fill="#2a78d6" >goal g = this row's latent (4 tokens)</text><path d="M454.0 230 L466.0 230 L460.0 222 z" fill="#1d1f24" stroke="#1d1f24" stroke-width="1"/><path d="M455.0 230 L465.0 230 L460.0 222 z" fill="#ffffff" stroke="#5d6270" stroke-width="1.2"/><text x="450.0" y="242" font-size="9.5" text-anchor="end" font-weight="400" fill="#5d6270" >policy's current position</text><text x="470.0" y="242" font-size="9.5" text-anchor="start" font-weight="400" fill="#5d6270" >clock position = start + steps executed (ignores the policy's lag)</text><path d="M460.0 221 L603.0 221" fill="none" stroke="#2a78d6" stroke-width="1.3" marker-end="url(#arb)" stroke-dasharray="3 2"/><text x="531.5" y="217" font-size="9.5" text-anchor="middle" font-weight="700" fill="#2a78d6" >+32 rows</text><text x="16" y="260" font-size="12" text-anchor="start" font-weight="700" fill="#2a78d6" >oracle_progress (progress-aligned)</text><text x="16" y="278" font-size="10.5" text-anchor="start" font-weight="400" fill="#5d6270" >find the demo row j* nearest the current observation latent; goal = j* + 32. Re-picks the goal to match the policy's lag (co-primary)</text><rect x="200" y="306" width="650" height="26" rx="3" fill="#dbe9f3" stroke="#2a78d6" stroke-width="1.2" /><line x1="232.5" y1="306" x2="232.5" y2="332" stroke="#2a78d6" stroke-width="0.5"/><line x1="265.0" y1="306" x2="265.0" y2="332" stroke="#2a78d6" stroke-width="0.5"/><line x1="297.5" y1="306" x2="297.5" y2="332" stroke="#2a78d6" stroke-width="0.5"/><line x1="330.0" y1="306" x2="330.0" y2="332" stroke="#2a78d6" stroke-width="0.5"/><line x1="362.5" y1="306" x2="362.5" y2="332" stroke="#2a78d6" stroke-width="0.5"/><line x1="395.0" y1="306" x2="395.0" y2="332" stroke="#2a78d6" stroke-width="0.5"/><line x1="427.5" y1="306" x2="427.5" y2="332" stroke="#2a78d6" stroke-width="0.5"/><line x1="460.0" y1="306" x2="460.0" y2="332" stroke="#2a78d6" stroke-width="0.5"/><line x1="492.5" y1="306" x2="492.5" y2="332" stroke="#2a78d6" stroke-width="0.5"/><line x1="525.0" y1="306" x2="525.0" y2="332" stroke="#2a78d6" stroke-width="0.5"/><line x1="557.5" y1="306" x2="557.5" y2="332" stroke="#2a78d6" stroke-width="0.5"/><line x1="590.0" y1="306" x2="590.0" y2="332" stroke="#2a78d6" stroke-width="0.5"/><line x1="622.5" y1="306" x2="622.5" y2="332" stroke="#2a78d6" stroke-width="0.5"/><line x1="655.0" y1="306" x2="655.0" y2="332" stroke="#2a78d6" stroke-width="0.5"/><line x1="687.5" y1="306" x2="687.5" y2="332" stroke="#2a78d6" stroke-width="0.5"/><line x1="720.0" y1="306" x2="720.0" y2="332" stroke="#2a78d6" stroke-width="0.5"/><line x1="752.5" y1="306" x2="752.5" y2="332" stroke="#2a78d6" stroke-width="0.5"/><line x1="785.0" y1="306" x2="785.0" y2="332" stroke="#2a78d6" stroke-width="0.5"/><line x1="817.5" y1="306" x2="817.5" y2="332" stroke="#2a78d6" stroke-width="0.5"/><text x="192" y="318" font-size="10" text-anchor="end" font-weight="400" fill="#2a78d6" >same episode's demo</text><text x="192" y="330" font-size="9" text-anchor="end" font-weight="400" fill="#5d6270" >row 0 … last row</text><path d="M499.5 296 L511.5 296 L505.5 304 z" fill="#2a78d6" stroke="#2a78d6" stroke-width="1"/><text x="505.5" y="291" font-size="10" text-anchor="middle" font-weight="700" fill="#2a78d6" >goal g = this row's latent (4 tokens)</text><path d="M454.0 342 L466.0 342 L460.0 334 z" fill="#1d1f24" stroke="#1d1f24" stroke-width="1"/><text x="460.0" y="354" font-size="9.5" text-anchor="middle" font-weight="400" fill="#5d6270" >policy's current position ≈ nearest row j* (the policy lags the demo)</text><path d="M460.0 333 L505.5 333" fill="none" stroke="#2a78d6" stroke-width="1.3" marker-end="url(#arb)" stroke-dasharray="3 2"/><text x="482.75" y="329" font-size="9.5" text-anchor="middle" font-weight="700" fill="#2a78d6" >+32 rows</text><text x="16" y="372" font-size="12" text-anchor="start" font-weight="700" fill="#1baf7a" >swap (goal from another demo)</text><text x="16" y="390" font-size="10.5" text-anchor="start" font-weight="400" fill="#5d6270" >clock-aligned goal taken from the next episode's demo. Control for whether the lower reads the goal</text><rect x="200" y="418" width="650" height="26" rx="3" fill="#dcf3e8" stroke="#1baf7a" stroke-width="1.2" /><line x1="232.5" y1="418" x2="232.5" y2="444" stroke="#1baf7a" stroke-width="0.5"/><line x1="265.0" y1="418" x2="265.0" y2="444" stroke="#1baf7a" stroke-width="0.5"/><line x1="297.5" y1="418" x2="297.5" y2="444" stroke="#1baf7a" stroke-width="0.5"/><line x1="330.0" y1="418" x2="330.0" y2="444" stroke="#1baf7a" stroke-width="0.5"/><line x1="362.5" y1="418" x2="362.5" y2="444" stroke="#1baf7a" stroke-width="0.5"/><line x1="395.0" y1="418" x2="395.0" y2="444" stroke="#1baf7a" stroke-width="0.5"/><line x1