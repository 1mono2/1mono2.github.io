#8fd3b8" stroke-width="0" /><text x="425.3530751708428" y="173" font-size="10.5" text-anchor="middle" font-weight="700" fill="#1d1f24" >26</text><rect x="445.30523917995447" y="156" width="16.952164009111584" height="26" rx="2" fill="#1baf7a" stroke="#1baf7a" stroke-width="0" /><rect x="464.25740318906605" y="156" width="44.65148063781322" height="26" rx="2" fill="#f9c6a8" stroke="#f9c6a8" stroke-width="0" /><text x="486.5831435079727" y="173" font-size="10.5" text-anchor="middle" font-weight="700" fill="#1d1f24" >32</text><rect x="510.9088838268793" y="156" width="210.84738041002282" height="26" rx="2" fill="#f29a6a" stroke="#f29a6a" stroke-width="0" /><text x="616.3325740318907" y="173" font-size="10.5" text-anchor="middle" font-weight="700" fill="#1d1f24" >146</text><rect x="723.7562642369021" y="156" width="143.7858769931662" height="26" rx="2" fill="#eb6834" stroke="#eb6834" stroke-width="0" /><text x="795.6492027334851" y="173" font-size="10.5" text-anchor="middle" font-weight="700" fill="#fff" >100</text><rect x="869.5421412300683" y="156" width="0.5" height="26" rx="2" fill="#6b7280" stroke="#6b7280" stroke-width="0" /><text x="220" y="217" font-size="11" text-anchor="end" font-weight="400" fill="#1d1f24" >progress-aligned (true future)</text><rect x="231.0" y="202" width="181.69020501138948" height="26" rx="2" fill="#2a78d6" stroke="#2a78d6" stroke-width="0" /><text x="321.84510250569474" y="219" font-size="10.5" text-anchor="middle" font-weight="700" fill="#fff" >126</text><rect x="414.6902050113895" y="202" width="35.90432801822328" height="26" rx="2" fill="#8fd3b8" stroke="#8fd3b8" stroke-width="0" /><text x="432.6423690205012" y="219" font-size="10.5" text-anchor="middle" font-weight="700" fill="#1d1f24" >26</text><rect x="452.59453302961276" y="202" width="27.157175398633285" height="26" rx="2" fill="#1baf7a" stroke="#1baf7a" stroke-width="0" /><text x="466.17312072892935" y="219" font-size="10.5" text-anchor="middle" font-weight="700" fill="#fff" >20</text><rect x="481.75170842824605" y="202" width="76.72437357630974" height="26" rx="2" fill="#f9c6a8" stroke="#f9c6a8" stroke-width="0" /><text x="520.1138952164009" y="219" font-size="10.5" text-anchor="middle" font-weight="700" fill="#1d1f24" >54</text><rect x="560.4760820045558" y="202" width="180.2323462414579" height="26" rx="2" fill="#f29a6a" stroke="#f29a6a" stroke-width="0" /><text x="650.5922551252847" y="219" font-size="10.5" text-anchor="middle" font-weight="700" fill="#1d1f24" >125</text><rect x="742.7084282460137" y="202" width="126.29157175398632" height="26" rx="2" fill="#eb6834" stroke="#eb6834" stroke-width="0" /><text x="805.8542141230068" y="219" font-size="10.5" text-anchor="middle" font-weight="700" fill="#fff" >88</text><rect x="20" y="249" width="12" height="12" rx="2" fill="#2a78d6" stroke="#2a78d6" stroke-width="0" /><text x="36" y="260" font-size="10.5" text-anchor="start" font-weight="400" fill="#1d1f24" >success</text><rect x="102.1" y="249" width="12" height="12" rx="2" fill="#8fd3b8" stroke="#8fd3b8" stroke-width="0" /><text x="118.1" y="260" font-size="10.5" text-anchor="start" font-weight="400" fill="#1d1f24" >near miss</text><rect x="196.79999999999998" y="249" width="12" height="12" rx="2" fill="#1baf7a" stroke="#1baf7a" stroke-width="0" /><text x="212.79999999999998" y="260" font-size="10.5" text-anchor="start" font-weight="400" fill="#1d1f24" >angle only</text><rect x="297.79999999999995" y="249" width="12" height="12" rx="2" fill="#f9c6a8" stroke="#f9c6a8" stroke-width="0" /><text x="313.79999999999995" y="260" font-size="10.5" text-anchor="start" font-weight="400" fill="#1d1f24" >stalled</text><rect x="379.9" y="249" width="12" height="12" rx="2" fill="#f29a6a" stroke="#f29a6a" stroke-width="0" /><text x="395.9" y="260" font-size="10.5" text-anchor="start" font-weight="400" fill="#1d1f24" >wandered</text><rect x="468.29999999999995" y="249" width="12" height="12" rx="2" fill="#eb6834" stroke="#eb6834" stroke-width="0" /><text x="484.29999999999995" y="260" font-size="10.5" text-anchor="start" font-weight="400" fill="#1d1f24" >pushed away</text><rect x="575.5999999999999" y="249" width="12" height="12" rx="2" fill="#6b7280" stroke="#6b7280" stroke-width="0" /><text x="591.5999999999999" y="260" font-size="10.5" text-anchor="start" font-weight="400" fill="#1d1f24" >off board</text><text x="20" y="284" font-size="10" text-anchor="start" font-weight="400" fill="#5d6270" >Type definitions (failures only, applied in order): off board = T left the board; near miss = error within 2× tolerance; angle only = position close, angle over 40°;</text><text x="20" y="300" font-size="10" text-anchor="start" font-weight="400" fill="#5d6270" >pushed away = final position error ≥ 30 px worse than at start; stalled = screen barely changes in the last 64 steps; wandered = the rest (moves, never approaches).</text><text x="20" y="324" font-size="10.5" text-anchor="start" font-weight="400" fill="#1d1f24" >Of flat's 285 failures, pushed away (136) and wandered (86) make up 78%. Precision problems (near miss, angle only) are only 11%.</text><text x="20" y="342" font-size="10.5" text-anchor="start" font-weight="400" fill="#1d1f24" >The true future only reduces pushed away; those episodes move to wandered and stalled. It corrects the push direction but does not get the T there.</text></svg>
