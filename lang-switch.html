<script>
// Point the navbar language links at the same page in the other language,
// hide the link for the language being read, remember an explicit choice,
// and send the site title to the post list of the current language.
(function () {
  var path = location.pathname;
  var lang = path.indexOf('/ja/') !== -1 ? 'ja' : path.indexOf('/en/') !== -1 ? 'en' : null;
  document.querySelectorAll('#quarto-header a.nav-link').forEach(function (a) {
    var label = a.textContent.trim();
    var target = label === 'English' ? 'en' : label === '日本語' ? 'ja' : null;
    if (!target || !lang) return;
    if (target === lang) { a.closest('li').style.display = 'none'; return; }
    a.setAttribute('href', path.replace('/' + lang + '/', '/' + target + '/'));
    a.addEventListener('click', function () {
      try { localStorage.setItem('preferred-lang', target); } catch (e) {}
    });
  });
  if (lang) {
    var brand = document.querySelector('#quarto-header a.navbar-brand');
    if (brand) brand.setAttribute('href', path.slice(0, path.indexOf('/' + lang + '/') + lang.length + 2));
  }
})();
</script>
