</defs><text x="16" y="24" font-size="14" text-anchor="start" font-weight="700" fill="#1d1f24" >階層のスイッチを 1 つずつ切り替える（左が元の設計、右が変更後）</text><text x="16" y="60" font-size="12.5" text-anchor="start" font-weight="700" fill="#eb6834" >③ 再帰切断: 上位の入力から c を外す</text><g transform="translate(16,70)"><text x="10" y="18" font-size="12.5" text-anchor="start" font-weight="700" fill="#1d1f24" >元の設計: 上位は E₀ と c₀ の両方を読む</text><rect x="20" y="160" width="170" height="52" rx="6" fill="#dbe9f3" stroke="#2a78d6" stroke-width="1.5" /><text x="105" y="181" font-size="11" text-anchor="middle" font-weight="400" fill="#1d1f24" >ブロック 0（下位、4 チャンク）</text><text x="105" y="200" font-size="10.5" text-anchor="middle" font-weight="400" fill="#5d6270" >c₀ を読む</text><rect x="270" y="160" width="170" height="52" rx="6" fill="#dbe9f3" stroke="#2a78d6" stroke-width="1.5" /><text x="355" y="181" font-size="11" text-anchor="middle" font-weight="400" fill="#1d1f24" >ブロック 1（下位、4 チャンク）</text><text x="355" y="200" font-size="10.5" text-anchor="middle" font-weight="400" fill="#5d6270" >c₁ を読む</text><circle cx="60" cy="40" r="16" fill="#ffffff" stroke="#6b7280" stroke-width="2"/><text x="60" y="45" font-size="12" text-anchor="middle" font-weight="700" fill="#1d1f24" >c₀</text><circle cx="400" cy="40" r="16" fill="#f6e4d4" stroke="#eb6834" stroke-width="2"/><text x="400" y="45" font-size="12" text-anchor="middle" font-weight="700" fill="#1d1f24" >c₁</text><text x="60" y="80" font-size="10.5" text-anchor="middle" font-weight="400" fill="#5d6270" >学習する定数</text><rect x="200" y="22" width="130" height="36" rx="5" fill="#eb6834" stroke="#eb6834" stroke-width="1" /><text x="265" y="45" font-size="11" text-anchor="middle" font-weight="700" fill="#fff" >上位 u_ψ</text><rect x="120" y="100" width="80" height="26" rx="4" fill="#ffffff" stroke="#2a78d6" stroke-width="1.5" /><text x="160" y="118" font-size="11" text-anchor="middle" font-weight="400" fill="#1d1f24" >終点 E₀</text><text x="205" y="142" font-size="10.5" text-anchor="middle" font-weight="400" fill="#5d6270" >下位が Euler 6 段で出した予測</text><line x1="60" y1="56" x2="60" y2="158" stroke="#1d1f24" stroke-width="1.6" marker-end="url(#ar)"/><line x1="105" y1="158" x2="140" y2="128" stroke="#1d1f24" stroke-width="1.6" marker-end="url(#ar)"/><line x1="200" y1="108" x2="235" y2="60" stroke="#1d1f24" stroke-width="1.6" marker-end="url(#ar)"/><line x1="76" y1="40" x2="198" y2="40" stroke="#1d1f24" stroke-width="1.6" marker-end="url(#ar)"/><text x="137" y="34" font-size="10.5" text-anchor="middle" font-weight="400" fill="#5d6270" >c₀ も入力に</text><line x1="330" y1="40" x2="382" y2="40" stroke="#1d1f24" stroke-width="1.6" marker-end="url(#ar)"/><line x1="400" y1="56" x2="400" y2="158" stroke="#1d1f24" stroke-width="1.6" marker-end="url(#ar)"/><text x="355" y="236" font-size="10.5" text-anchor="middle" font-weight="400" fill="#b2342f" >損失 L₁（ブロック 1 の予測誤差）</text><text x="105" y="236" font-size="10.5" text-anchor="middle" font-weight="400" fill="#b2342f" >損失 L₀</text></g><g transform="translate(490,70)"><text x="10" y="18" font-size="12.5" text-anchor="start" font-weight="700" fill="#1d1f24" >変更: 上位は E₀ だけを読む。c の鎖が消える</text><rect x="20" y="160" width="170" height="52" rx="6" fill="#dbe9f3" stroke="#2a78d6" stroke-width="1.5" /><text x="105" y="181" font-size="11" text-anchor="middle" font-weight="400" fill="#1d1f24" >ブロック 0（下位、4 チャンク）</text><text x="105" y="200" font-size="10.5" text-anchor="middle" font-weight="400" fill="#5d6270" >c₀ を読む</text><rect x="270" y="160" width="170" height="52" rx="6" fill="#dbe9f3" stroke="#2a78d6" stroke-width="1.5" /><text x="355" y="181" font-size="11" text-anchor="middle" font-weight="400" fill="#1d1f24" >ブロック 1（下位、4 チャンク）</text><text x="355" y="200" font-size="10.5" text-anchor="middle" font-weight="400" fill="#5d6270" >c₁ を読む</text><circle cx="60" cy="40" r="16" fill="#ffffff" stroke="#6b7280" stroke-width="2"/><text x="60" y="45" font-size="12" text-anchor="middle" font-weight="700" fill="#1d1f24" >c₀</text><circle 