"start" font-weight="700" fill="#2a78d6" >flat（比較の基準線）</text><text x="30" y="380" font-size="11" text-anchor="start" font-weight="400" fill="#1d1f24" >上位を持たず、どのブロックでも c₀ を読む。下位の構造・初期値・データ・乱数列は hier と同一で、違いは上位の有無だけ。</text><text x="30" y="398" font-size="10.5" text-anchor="start" font-weight="400" fill="#5d6270" >評価: 試験 439 話の初期状態から走らせ、300 手以内に T 字ブロックが (256, 256, 45°) に 20 px・20° 以内で成功。</text><text x="30" y="412" font-size="10.5" text-anchor="start" font-weight="400" fill="#5d6270" >方策に目標は入力しない。実演がこの基準で終わる話は 63.3%（模倣の天井）。</text></svg>
