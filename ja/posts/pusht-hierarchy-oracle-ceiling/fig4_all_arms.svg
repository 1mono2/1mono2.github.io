</defs><text x="16" y="24" font-size="14" text-anchor="start" font-weight="700" fill="#1d1f24" >3 回の実験の固定目標閉ループ（439 話、10k 更新、Euler 6 段）</text><text x="20" y="74" font-size="11.5" text-anchor="start" font-weight="700" fill="#1d1f24" >最初の設計</text><text x="40" y="96" font-size="11" text-anchor="start" font-weight="400" fill="#1d1f24" >flat</text><line x1="300" y1="92" x2="760" y2="92" stroke="#eceae3" stroke-width="1"/><circle cx="680.7777777777778" cy="92" r="6" fill="#2a78d6" stroke="#2a78d6" stroke-width="1.5"/><text x="768" y="96" font-size="9.5" text-anchor="start" font-weight="400" fill="#5d6270" >149</text><text x="40" y="120" font-size="11" text-anchor="start" font-weight="400" fill="#1d1f24" >階層</text><line x1="300" y1="116" x2="760" y2="116" stroke="#eceae3" stroke-width="1"/><circle cx="627.1111111111111" cy="116" r="6" fill="#eb6834" stroke="#eb6834" stroke-width="1.5"/><circle cx="632.2222222222222" cy="116" r="5.5" fill="#ffffff" stroke="#eb6834" stroke-width="2"/><text x="622.0" y="120.5" font-size="13" text-anchor="middle" font-weight="700" fill="#eb6834">×</text><text x="768" y="120" font-size="9.5" text-anchor="start" font-weight="400" fill="#5d6270" >128　hold 130　c_mean 126</text><text x="20" y="152" font-size="11.5" text-anchor="start" font-weight="700" fill="#1d1f24" >スイッチの切り替え</text><text x="40" y="174" font-size="11" text-anchor="start" font-weight="400" fill="#1d1f24" >flat</text><line x1="300" y1="170" x2="760" y2="170" stroke="#eceae3" stroke-width="1"/><circle cx="693.5555555555555" cy="170" r="6" fill="#2a78d6" stroke="#2a78d6" stroke-width="1.5"/><text x="768" y="174" font-size="9.5" text-anchor="start" font-weight="400" fill="#5d6270" >154</text><text x="40" y="198" font-size="11" text-anchor="start" font-weight="400" fill="#1d1f24" >勾配遮断</text><line x1="300" y1="194" x2="760" y2="194" stroke="#eceae3" stroke-width="1"/><circle cx="629.6666666666667" cy="194" r="6" fill="#eb6834" stroke="#eb6834" stroke-width="1.5"/><circle cx="637.3333333