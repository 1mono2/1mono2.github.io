5" y1="54" x2="693.5555555555555" y2="368" stroke="#2a78d6" stroke-width="1.2" stroke-dasharray="5 3"/><text x="697.5555555555555" y="64" font-size="9.5" text-anchor="start" font-weight="400" fill="#2a78d6" >flat 154</text><circle cx="40" cy="390" r="6" fill="#eb6834" stroke="#eb6834" stroke-width="1.5"/><text x="52" y="394" font-size="10.5" text-anchor="start" font-weight="400" fill="#1d1f24" >通常（上位の出力を読む）</text><circle cx="230" cy="390" r="5.5" fill="#ffffff" stroke="#eb6834" stroke-width="2"/><text x="242" y="394" font-size="10.5" text-anchor="start" font-weight="400" fill="#1d1f24" >hold（c を c₀ に固定）</text><text x="400" y="394.5" font-size="13" text-anchor="middle" font-weight="700" fill="#eb6834">×</text><text x="412" y="394" font-size="10.5" text-anchor="start" font-weight="400" fill="#1d1f24" >c_mean（学習窓の平均に固定）</text><circle cx="620" cy="390" r="6" fill="#2a78d6" stroke="#2a78d6" stroke-width="1.5"/><text x="632" y="394" font-size="10.5" text-anchor="start" font-weight="400" fill="#1d1f24" >上位なし（flat・null）</text><circle cx="790" cy="390" r="6" fill="#1baf7a" stroke="#1baf7a" stroke-width="1.5"/><text x="802" y="394" font-size="10.5" text-anchor="start" font-weight="400" fill="#1d1f24" >swap</text><text x="20" y="416" font-size="10.5" text-anchor="start" font-weight="400" fill="#5d6270" >どの実験でも、上位を持つ腕（橙）が flat（青）を上回る条件はない。hold と c_mean が通常と同じ水準なのは、上位の出力が制御に使われていない印。実演の天井は 278（63.3%）。</text></svg>
