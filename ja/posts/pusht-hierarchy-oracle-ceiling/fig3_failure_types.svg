</defs><text x="16" y="24" font-size="14" text-anchor="start" font-weight="700" fill="#1d1f24" >閉ループの失敗の型（同じ 439 話。上位なしの flat と、真の未来を与えた下位）</text><text x="220" y="79" font-size="11" text-anchor="end" font-weight="400" fill="#1d1f24" >flat（上位なし）</text><rect x="231.0" y="64" width="222.51025056947606" height="26" rx="2" fill="#2a78d6" stroke="#2a78d6" stroke-width="0" /><text x="342.255125284738" y="81" font-size="10.5" text-anchor="middle" font-weight="700" fill="#fff" >154</text><rect x="455.51025056947606" y="64" width="18.410022779043288" height="26" rx="2" fill="#8fd3b8" stroke="#8fd3b8" stroke-width="0" /><rect x="475.92027334851934" y="64" width="24.241457858769934" height="26" rx="2" fill="#1baf7a" stroke="#1baf7a" stroke-width="0" /><text x="488.04100227790434" y="81" font-size="10.5" text-anchor="middle" font-weight="700" fill="#fff" >18</text><rect x="502.1617312072893" y="64" width="40.277904328018224" height="26" rx="2" fill="#f9c6a8" stroke="#f9c6a8" stroke-width="0" /><text x="522.3006833712984" y="81" font-size="10.5" text-anchor="middle" font-weight="700" fill="#1d1f24" >29</text><rect x="544.4396355353075" y="64" width="123.37585421412302" height="26" rx="2" fill="#f29a6a" stroke="#f29a6a" stroke-width="0" /><text x="606.127562642369" y="81" font-size="10.5" text-anchor="middle" font-weight="700" fill="#1d1f24" >86</text><rect x="669.8154897494305" y="64" width="196.26879271070618" height="26" rx="2" fill="#eb6834" stroke="#eb6834" stroke-width="0" /><text x="767.9498861047836" y="81" font-size="10.5" text-anchor="middle" font-weight="700" fill="#fff" >136</text><rect x="868.0842824601367" y="64" width="0.9157175398632944" height="26" rx="2" fill="#6b7280" stroke="#6b7280" stroke-width="0" /><text x="220" y="125" font-size="11" text-anchor="end" font-weight="400" fill="#1d1f24" >null（空の目標）</text><rect x="231.0" y="110" width="151.0751708428246" height="26" rx="2" fill="#2a78d6" stroke="#2a78d6" stroke-width="0" /><text x="306.5375854214123" y="127" font-size="10.5" text-anchor="middle" font-weight="700" fill="#fff" >105</text><rect x="384.0751708428246" y="110" width="35.904328018223225" height="26" rx="2" fill="#8fd3b8" stroke="#8fd3b8" stroke-width="0" /><text x="402.0273348519362" y="127" font-size="10.5" text-anchor="middle" font-weight="700" fill="#1d1f24" >26</text><rect x="421.97949886104783" y="110" width="31.530751708428227" height="26" rx="2" fill="#1baf7a" stroke="#1baf7a" stroke-width="0" /><text x="437.744874715262" y="127" font-size="10.5" text-anchor="middle" font-weight="700" fill="#fff" >23</text><rect x="455.51025056947606" y="110" width="66.51936218678816" height="26" rx="2" fill="#f9c6a8" stroke="#f9c6a8" stroke-width="0" /><text x="488.76993166287014" y="127" font-size="10.5" text-anchor="middle" font-weight="700" fill="#1d1f24" >47</text><rect x="524.0296127562642" y="110" width="146.70159453302972" height="26" rx="2" fill="#f29a6a" stroke="#f29a6a" stroke-width="0" /><text x="597.380410022779" y="127" font-size="10.5" text-anchor="middle" font-weight="700" fill="#1d1f24" >102</text><rect x="672.7312072892939" y="110" width="193.35307517084277" height="26" rx="2" fill="#eb6834" stroke="#eb6834" stroke-width="0" /><text x="769.4077448747153" y="127" font-size="10.5" text-anchor="middle" font-weight="700" fill="#fff" >134</text><rect x="868.0842824601367" y="110" width="0.9157175398632944" height="26" rx="2" fill="#6b7280" stroke="#6b7280" stroke-width="0" /><text x="220" y="171" font-size="11" text-anchor="end" font-weight="400" fill="#1d1f24" >時刻合わせ（真の未来）</text><rect x="231.0" y="156" width="174.4009111617312" height="26" rx="2" fill="#2a78d6" stroke="#2a78d6" stroke-width="0" /><text x="318.2004555808656" y="173" font-size="10.5" text-anchor="middle" font-weight="700" fill="#fff" >121</text><rect x="407.4009111617312" y="156" width="35.90432801822328" height="26" rx="2" fill="#8fd3b8" stroke="#8fd3b8" stroke-width="0" /><text x="425.3530751708428" y="173" font-size="10.5" text-anchor="middle" font-weight="700" fill="#1d1f24" >26</text><rect x="445.30523917995447" y="156" width="16.952164009111584" height="26" rx="2" fill="#1baf7a" stroke="#1baf7a" stroke-width="0" /><rect x="464.25740318906605" y="156" width="44.65148063781322" height="26" rx="2" fill="#f9c6a8" stroke="#f9c6a8" stroke-width="0" /><text x="486.5831435079727" y="173" font-size="10.5" text-anchor="middle" font-weight="700" fill="#1d1f24" >32</text><rect x="510.9088838268793" y="156" width="210.84738041002282" height="26" rx="2" fill="#f29a6a" stroke="#f29a6a" stroke-width="0" /><text x="616.3325740318907" y="173" font-size="10.5" text-anchor="middle" font-weight="700" fill="#1d1f24" >146</text><rect x="723.7562642369021" y="156" width="143.7858769931662" height="26" rx="2" fill="#eb6834" stroke="#eb6834" stroke-width="0" /><text x="795.6492027334851" y="173" font-size="10.5" text-anchor="middle" font-weight="700" fill="#fff" >100</text><rect x="869.5421412300683" y="156" width="0.5" height="26" rx="2" fill="#6b7280" stroke="#6b7280" stroke-width="0" /><text x="220" y="217" font-size="11" text-anchor="end" font-weight="400" fill="#1d1f24" >進捗合わせ（真の未来）</text><rect x="231.0" y="202" width="181.69020501138948" height="26" rx="2" fill="#2a78d6" stroke="#2a78d6" stroke-width="0" /><text x="321.84510250569474" y="219" font-size="10.5" text-anchor="middle" font-weight="700" fill="#fff" >126</text><rect x="414.6902050113895" y="202" width="35.90432801822328" height="26" rx="2" fill="#8fd3b8" stroke="#8fd3b8" stroke-width="0" /><text x="432.6423690205012" y="219" font-size="10.5" text-anchor="middle" font-weight="700" fill="#1d1f24" >26</text><rect x="452.59453302961276" y="202" width="27.157175398633285" height="26" rx="2" fill="#1baf7a" stroke="#1baf7a" stroke-width="0" /><text x="466.17312072892935" y="219" font-size="10.5" text-anchor="middle" font-weight="700" fill="#fff" >20</text><rect x="481.75170842824605" y="202" width="76.72437357630974" height="26" rx="2" fill="#f9c6a8" stroke="#f9c6a8" stroke-width="0" /><text x="520.1138952164009" y="219" font-size="10.5" text-anchor="middle" font-weight="700" fill="#1d1f24" >54</text><rect x="560.4760820045558" y="202" width="180.2323462414579" height="26" rx="2" fill="#f29a6a" stroke="#f29a6a" stroke-width="0" /><text x="650.5922551252847" y="219" font-size="10.5" text-anchor="middle" font-weight="700" fill="#1d1f24" >125</text><rect x="742.7084282460137" y="202" width="126.29157175398632" height="26" rx="2" fill="#eb6834" stroke="#eb6834" stroke-width="0" /><text x="805.8542141230068" y="219" font-size="10.5" text-anchor="middle" font-weight="700" fill="#fff" >88</text><rect x="20" y="249" width="12" height="12" rx="2" fill="#2a78d6" stroke="#2a78d6" stroke-width="0" /><text x="36" y="260" font-size="10.5" text-anchor="start" font-weight="400" fill="#1d1f24" >成功</text><rect x="80" y="249" width="12" height="12" rx="2" fill="#8fd3b8" stroke="#8fd3b8" stroke-width="0" /><text x="96" y="260" font-size="10.5" text-anchor="start" font-weight="400" fill="#1d1f24" >あと一歩</text><rect x="162" y="249" width="12" height="12" rx="2" fill="#1baf7a" stroke="#1baf7a" stroke-width="0" /><text x="178" y="260" font-size="10.5" text-anchor="start" font-weight="400" fill="#1d1f24" >角度だけ</text><rect x="244" y="249" width="12" height="12" rx="2" fill="#f9c6a8" stroke="#f9c6a8" stroke-width="0" /><text x="260" y="260" font-size="10.5" text-anchor="start" font-weight="400" fill="#1d1f24" >止まった</text><rect x="326" y="249" width="12" height="12" rx="2" fill="#f29a6a" stroke="#f29a6a" stroke-width="0" /><text x="342" y="260" font-size="10.5" text-anchor="start" font-weight="400" fill="#1d1f24" >さまよう</text><rect x="408" y="249" width="12" height="12" rx="2" fill="#eb6834" stroke="#eb6834" stroke-width="0" /><text x="424" y="260" font-size="10.5" text-anchor="start" font-weight="400" fill="#1d1f24" >遠ざけた</text><rect x="490" y="249" width="12" height="12" rx="2" fill="#6b7280" stroke="#6b7280" stroke-width="0" /><text x="506" y="260" font-size="10.5" text-anchor="start" font-weight="400" fill="#1d1f24" >場外</text><text x="20" y="284" font-size="10" text-anchor="start" font-weight="400" fill="#5d6270" >型の定義（失敗した話だけ、上から順に当てはめる）: 場外 = ブロックが盤外、あと一歩 = 誤差が許容の 2 倍以内、角度だけ = 位置は近く角度が 40° 超、</text><text x="20" y="300" font-size="10" text-anchor="start" font-weight="400" fill="#5d6270" >遠ざけた = 最終の位置誤差が初期より 30 px 以上大きい、止まった = 最後の 64 手で画面がほぼ変わらない、さまよう = 残り（動くが近づかない）。</text><text x="20" y="324" font-size="10.5" text-anchor="start" font-weight="400" fill="#1d1f24" >flat の失敗 285 話のうち「遠ざけた」136 と「さまよう」86 で 78%。精度の問題（あと一歩・角度だけ）は 11% しかない。</text><text x="20" y="342" font-size="10.5" text-anchor="start" font-weight="400" fill="#1d1f24" >真の未来を与えても「遠ざけた」が減るだけで、その分は「さまよう」「止まった」に移る。押す向きは正すが、届かせはしない。</text></svg>
