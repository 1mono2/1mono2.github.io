<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 610" width="900" height="610" role="img" aria-label="目標の与え方 4 条件。時刻合わせと進捗合わせは同じ実演の 32 手先、swap は別の話、null は空の目標" font-family="'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', system-ui, sans-serif" font-size="12" fill="#1d1f24"><rect width="900" height="610" fill="#ffffff"/><defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1d1f24"/></marker>
<marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2a78d6"/></marker>
<marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#eb6834"/></marker>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b2342f"/></marker>
<marker id="arm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5d6270"/></marker>
</defs><text x="16" y="24" font-size="14" text-anchor="start" font-weight="700" fill="#1d1f24" >下位に「32 手先の真の未来潜在」を目標として与える</text><rect x="16" y="40" width="868" height="74" rx="6" fill="#eceae3" stroke="#c9c6bd" stroke-width="1" /><text x="30" y="62" font-size="12" text-anchor="start" font-weight="700" fill="#1d1f24" >学習</text><text x="30" y="82" font-size="11" text-anchor="start" font-weight="400" fill="#1d1f24" >上位を置かず、各ブロックの目標 g = 同じ実演の 32 手後の I-JEPA 潜在（4 トークン）を、c₀ の代わりに下位の交差注意へ渡す。</text><text x="30" y="100" font-size="11" text-anchor="start" font-weight="400" fill="#1d1f24" >10% の (窓, ブロック) では目標を空にして学習する（null 条件を学習分布の内側に置くため）。他は flat と同一。</text><text x="16" y="148" font-size="12" text-anchor="start" font-weight="700" fill="#2a78d6" >oracle_time（時刻合わせ）</text><text x="16" y="166" font-size="10.5" text-anchor="start" font-weight="400" fill="#5d6270" >目標 = 実演の行「開始 + 実行済み手数 + 32」。方策が遅れても、時計どおりに先の行へ進む（共同主要）</text><rect x="200" y="194" width="650" height="26" rx="3" fill="#dbe9f3" stroke="#2a78d6" stroke-width="1.2" /><line x1="232.5" y1="194" x2="232.5" y2="220" stroke="#2a78d6" stroke-width="0.5"/><line x1="265.0" y1="194" x2="265.0" y2="220" stroke="#2a78d6" stroke-width="0.5"/><line x1="297.5" y1="194" x2="297.5" y2="220" stroke="#2a78d6" stroke-width="0.5"/><line x1="330.0" y1="194" x2="330.0" y2="220" stroke="#2a78d6" stroke-width="0.5"/><line x1="362.5" y1="194" x2="362.5" y2="220" stroke="#2a78d6" stroke-width="0.5"/><line x1="395.0" y1="194" x2="395.0" y2="220" stroke="#2a78d6" stroke-width="0.5"/><line x1="427.5" y1="194" x2="427.5" y2="220" stroke="#2a78d6" stroke-width="0.5"/><line x1="460.0" y1="194" x2="460.0" y2="220" stroke="#2a78d6" stroke-width="0.5"/><line x1="492.5" y1="194" x2="492.5" y2="220" stroke="#2a78d6" stroke-width="0.5"/><line x1="525.0" y1="194" x2="525.0" y2="220" stroke="#2a78d6" stroke-width="0.5"/><line x1="557.5" y1="194" x2="557.5" y2="220" stroke="#2a78d6" stroke-width="0.5"/><line x1="590.0" y1="194" x2="590.0" y2="220" stroke="#2a78d6" stroke-width="0.5"/><line x1="622.5" y1="194" x2="622.5" y2="220" stroke="#2a78d6" stroke-width="0.5"/><line x1="655.0" y1="194" x2="655.0" y2="220" stroke="#2a78d6" stroke-width="0.5"/><line x1="687.5" y1="194" x2="687.5" y2="220" stroke="#2a78d6" stroke-width="0.5"/><line x1="720.0" y1="194" x2="720.0" y2="220" stroke="#2a78d6" stroke-width="0.5"/><line x1="752.5" y1="194" x2="752.5" y2="220" stroke="#2a78d6" stroke-width="0.5"/><line x1="785.0" y1="194" x2="785.0" y2="220" stroke="#2a78d6" stroke-width="0.5"/><line x1="817.5" y1="194" x2="817.5" y2="220" stroke="#2a78d6" stroke-width="0.5"/><text x="192" y="206" font-size="10" text-anchor="end" font-weight="400" fill="#2a78d6" >同じ話の実演</text><text x="192" y="218" font-size="9" text-anchor="end" font-weight="400" fill="#5d6270" >行 0 … 最終行</text><path d="M597.0 184 L609.0 184 L603.0 192 z" fill="#2a78d6" stroke="#2a78d6" stroke-width="1"/><text x="603.0" y="179" font-size="10" text-anchor="middle" font-weight="700" fill="#2a78d6" >目標 g = この行の潜在（4 トークン）</text><path d="M454.0 230 L466.0 230 L460.0 222 z" fill="#1d1f24" stroke="#1d1f24" stroke-width="1"/><path d="M455.0 230 L465.0 230 L460.0 222 z" fill="#ffffff" stroke="#5d6270" stroke-width="1.2"/><text x="450.0" y="242" font-size="9.5" text-anchor="end" font-weight="400" fill="#5d6270" >方策の現在位置</text><text x="470.0" y="242" font-size="9.5" text-anchor="start" font-weight="400" fill="#5d6270" >時計の位置 = 開始 + 実行済み手数（方策の遅れは無視）</text><path d="M460.0 221 L603.0 221" fill="none" stroke="#2a78d6" stroke-width="1.3" marker-end="url(#arb)" stroke-dasharray="3 2"/><text x="531.5" y="217" font-size="9.5" text-anchor="middle" font-weight="700" fill="#2a78d6" >+32 行</text><text x="16" y="260" font-size="12" text-anchor="start" font-weight="700" fill="#2a78d6" >oracle_progress（進捗合わせ）</text><text x="16" y="278" font-size="10.5" text-anchor="start" font-weight="400" fill="#5d6270" >現在の観測潜在に最も近い実演の行 j* を探し、目標 = j* + 32。方策の遅れに合わせて目標を選び直す（共同主要）</text><rect x="200" y="306" width="650" height="26" rx="3" fill="#dbe9f3" stroke="#2a78d6" stroke-width="1.2" /><line x1="232.5" y1="306" x2="232.5" y2="332" stroke="#2a78d6" stroke-width="0.5"/><line x1="265.0" y1="306" x2="265.0" y2="332" stroke="#2a78d6" stroke-width="0.5"/><line x1="297.5" y1="306" x2="297.5" y2="332" stroke="#2a78d6" stroke-width="0.5"/><line x1="330.0" y1="306" x2="330.0" y2="332" stroke="#2a78d6" stroke-width="0.5"/><line x1="362.5" y1="306" x2="362.5" y2="332" stroke="#2a78d6" stroke-width="0.5"/><line x1="395.0" y1="306" x2="395.0" y2="332" stroke="#2a78d6" stroke-width="0.5"/><line x1="427.5" y1="306" x2="427.5" y2="332" stroke="#2a78d6" stroke-width="0.5"/><line x1="460.0" y1="306" x2="460.0" y2="332" stroke="#2a78d6" stroke-width="0.5"/><line x1="492.5" y1="306" x2="492.5" y2="332" stroke="#2a78d6" stroke-width="0.5"/><line x1="525.0" y1="306" x2="525.0" y2="332" stroke="#2a78d6" stroke-width="0.5"/><line x1="557.5" y1="306" x2="557.5" y2="332" stroke="#2a78d6" stroke-width="0.5"/><line x1="590.0" y1="306" x2="590.0" y2="332" stroke="#2a78d6" stroke-width="0.5"/><line x1="622.5" y1="306" x2="622.5" y2="332" stroke="#2a78d6" stroke-width="0.5"/><line x1="655.0" y1="306" x2="655.0" y2="332" stroke="#2a78d6" stroke-width="0.5"/><line x1="687.5" y1="306" x2="687.5" y2="332" stroke="#2a78d6" stroke-width="0.5"/><line x1="720.0" y1="306" x2="720.0" y2="332" stroke="#2a78d6" stroke-width="0.5"/><line x1="752.5" y1="306" x2="752.5" y2="332" stroke="#2a78d6" stroke-width="0.5"/><line x1="785.0" y1="306" x2="785.0" y2="332" stroke="#2a78d6" stroke-width="0.5"/><line x1="817.5" y1="306" x2="817.5" y2="332" stroke="#2a78d6" stroke-width="0.5"/><text x="192" y="318" font-size="10" text-anchor="end" font-weight="400" fill="#2a78d6" >同じ話の実演</text><text x="192" y="330" font-size="9" text-anchor="end" font-weight="400" fill="#5d6270" >行 0 … 最終行</text><path d="M499.5 296 L511.5 296 L505.5 304 z" fill="#2a78d6" stroke="#2a78d6" stroke-width="1"/><text x="505.5" y="291" font-size="10" text-anchor="middle" font-weight="700" fill="#2a78d6" >目標 g = この行の潜在（4 トークン）</text><path d="M454.0 342 L466.0 342 L460.0 334 z" fill="#1d1f24" stroke="#1d1f24" stroke-width="1"/><text x="460.0" y="354" font-size="9.5" text-anchor="middle" font-weight="400" fill="#5d6270" >方策の現在位置 ≈ 最近傍の行 j*（方策は実演より遅れている）</text><path d="M460.0 333 L505.5 333" fill="none" stroke="#2a78d6" stroke-width="1.3" marker-end="url(#arb)" stroke-dasharray="3 2"/><text x="482.75" y="329" font-size="9.5" text-anchor="middle" font-weight="700" fill="#2a78d6" >+32 行</text><text x="16" y="372" font-size="12" text-anchor="start" font-weight="700" fill="#1baf7a" >swap（別の実演の目標）</text><text x="16" y="390" font-size="10.5" text-anchor="start" font-weight="400" fill="#5d6270" >課題順で次の話の実演から、時刻合わせで目標を取る。下位が目標を読んでいるかの対照</text><rect x="200" y="418" width="650" height="26" rx="3" fill="#dcf3e8" stroke="#1baf7a" stroke-width="1.2" /><line x1="232.5" y1="418" x2="232.5" y2="444" stroke="#1baf7a" stroke-width="0.5"/><line x1="265.0" y1="418" x2="265.0" y2="444" stroke="#1baf7a" stroke-width="0.5"/><line x1="297.5" y1="418" x2="297.5" y2="444" stroke="#1baf7a" stroke-width="0.5"/><line x1="330.0" y1="418" x2="330.0" y2="444" stroke="#1baf7a" stroke-width="0.5"/><line x1="362.5" y1="418" x2="362.5" y2="444" stroke="#1baf7a" stroke-width="0.5"/><line x1="395.0" y1="418" x2="395.0" y2="444" stroke="#1baf7a" stroke-width="0.5"/><line x1="427.5" y1="418" x2="427.5" y2="444" stroke="#1baf7a" stroke-width="0.5"/><line x1="460.0" y1="418" x2="460.0" y2="444" stroke="#1baf7a" stroke-width="0.5"/><line x1="492.5" y1="418" x2="492.5" y2="444" stroke="#1baf7a" stroke-width="0.5"/><line x1="525.0" y1="418" x2="525.0" y2="444" stroke="#1baf7a" stroke-width="0.5"/><line x1="557.5" y1="418" x2="557.5" y2="444" stroke="#1baf7a" stroke-width="0.5"/><line x1="590.0" y1="418" x2="590.0" y2="444" stroke="#1baf7a" stroke-width="0.5"/><line x1="622.5" y1="418" x2="622.5" y2="444" stroke="#1baf7a" stroke-width="0.5"/><line x1="655.0" y1="418" x2="655.0" y2="444" stroke="#1baf7a" stroke-width="0.5"/><line x1="687.5" y1="418" x2="687.5" y2="444" stroke="#1baf7a" stroke-width="0.5"/><line x1="720.0" y1="418" x2="720.0" y2="444" stroke="#1baf7a" stroke-width="0.5"/><line x1="752.5" y1="418" x2="752.5" y2="444" stroke="#1baf7a" stroke-width="0.5"/><line x1="785.0" y1="418" x2="785.0" y2="444" stroke="#1baf7a" stroke-width="0.5"/><line x1="817.5" y1="418" x2="817.5" y2="444" stroke="#1baf7a" stroke-width="0.5"/><text x="192" y="430" font-size="10" text-anchor="end" font-weight="400" fill="#1baf7a" >別の話の実演</text><text x="192" y="442" font-size="9" text-anchor="end" font-weight="400" fill="#5d6270" >行 0 … 最終行</text><path d="M597.0 408 L609.0 408 L603.0 416 z" fill="#1baf7a" stroke="#1baf7a" stroke-width="1"/><text x="603.0" y="403" font-size="10" text-anchor="middle" font-weight="700" fill="#1baf7a" >目標 g = この行の潜在（4 トークン）</text><path d="M454.0 454 L466.0 454 L460.0 446 z" fill="#1d1f24" stroke="#1d1f24" stroke-width="1"/><path d="M455.0 454 L465.0 454 L460.0 446 z" fill="#ffffff" stroke="#5d6270" stroke-width="1.2"/><text x="450.0" y="466" font-size="9.5" text-anchor="end" font-weight="400" fill="#5d6270" >方策の現在位置</text><text x="470.0" y="466" font-size="9.5" text-anchor="start" font-weight="400" fill="#5d6270" >時計の位置 = 開始 + 実行済み手数（方策の遅れは無視）</text><path d="M460.0 445 L603.0 445" fill="none" stroke="#1baf7a" stroke-width="1.3" marker-end="url(#arm)" stroke-dasharray="3 2"/><text x="531.5" y="441" font-size="9.5" text-anchor="middle" font-weight="700" fill="#1baf7a" >+32 行</text><text x="16" y="484" font-size="12" text-anchor="start" font-weight="700" fill="#1d1f24" >null（空の目標）</text><text x="16" y="502" font-size="10.5" text-anchor="start" font-weight="400" fill="#5d6270" >目標を空（存在埋め込み 0）にして同じ重みを走らせる。目標付きの学習が下位を損なったかの対照</text><rect x="200" y="530" width="650" height="26" rx="3" fill="#ffffff" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="4 3"/><text x="525.0" y="547" font-size="10.5" text-anchor="middle" font-weight="400" fill="#5d6270" >目標なし（存在埋め込み 0）。同じ重みを flat として走らせる</text><text x="16" y="598" font-size="10" text-anchor="start" font-weight="400" fill="#5d6270" >目標は 32 手ごとに選び直し、ブロック内の 4 チャンクは同じ目標を読む（年齢 0/8/16/24 で残り手数を知る）。実演が終わった後は最終行に固定する。</text></svg>
